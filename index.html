<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Corp. | Management System v20.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg-dark: #020617; --accent: #d97706; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%); color: #e2e8f0; }
        h1, h2, h3, .fantasy-font { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #020617; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(51, 65, 85, 0.5); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }
        .btn-action:active { transform: scale(0.95); }
        .toast { background: rgba(0,0,0,0.9); border-left: 4px solid var(--accent); color: white; padding: 12px 20px; border-radius: 4px; margin-bottom: 10px; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 100; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-sm">

    <div id="toast-container"></div>
    <audio id="sfx-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="sfx-coin" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-alarm" src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3"></audio>

    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95">
        <div class="w-full max-w-md p-8 border border-amber-900/50 rounded-lg bg-[#050101] relative">
            <div class="text-center mb-8"><h1 class="fantasy-font text-5xl text-amber-600 mb-2">INK CORP.</h1><p class="text-slate-500 text-xs tracking-[0.4em]">System v20.0</p></div>
            <div id="login-form" class="space-y-4">
                <input type="text" id="login-user" class="w-full bg-slate-900/50 border border-slate-800 p-3 text-white rounded text-center tracking-widest outline-none" placeholder="NOME UTENTE">
                <input type="password" id="login-pass" class="w-full bg-slate-900/50 border border-slate-800 p-3 text-white rounded text-center tracking-widest outline-none" placeholder="PASSWORD">
                <button onclick="authLogin()" class="w-full bg-amber-700 hover:bg-amber-600 text-black font-bold py-3 rounded uppercase tracking-wider transition-colors">Connetti</button>
                <div class="text-center pt-2"><button onclick="toggleAuthMode()" class="text-xs text-slate-500 hover:text-amber-500 underline">Nuovo Profilo?</button></div>
            </div>
            <div id="register-form" class="space-y-4 hidden">
                <input type="text" id="reg-user" class="w-full bg-slate-900/50 border border-emerald-900 p-3 text-white rounded text-center" placeholder="USERNAME">
                <input type="password" id="reg-pass" class="w-full bg-slate-900/50 border border-emerald-900 p-3 text-white rounded text-center" placeholder="PASSWORD">
                <input type="password" id="reg-code" class="w-full bg-slate-900/50 border border-emerald-900 p-3 text-emerald-500 rounded text-center tracking-[0.2em]" placeholder="CODICE (INK2025)">
                <button onclick="authRegister()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded uppercase">CREA</button>
                <div class="text-center pt-2"><button onclick="toggleAuthMode()" class="text-xs text-slate-500 hover:text-white underline">Torna al Login</button></div>
            </div>
            <div id="auth-msg" class="text-center text-xs text-red-500 mt-4 min-h-[20px]"></div>
        </div>
    </div>

    <div id="app-interface" class="flex flex-col h-full hidden opacity-0 transition-opacity duration-700">
        <header class="h-16 bg-slate-900 border-b border-slate-800 flex justify-between items-center px-6 z-20 shadow-lg">
            <div class="flex items-center gap-4 cursor-pointer" onclick="initApp()">
                <div class="text-amber-500 text-2xl"><i class="fa-solid fa-dragon"></i></div>
                <div><h1 class="fantasy-font text-xl text-slate-200 font-bold tracking-wider">INK CORP.</h1><div class="text-[9px] text-emerald-500 font-mono">FINANCIAL DISTRICT</div></div>
            </div>
            <div class="hidden md:flex items-center gap-8">
                <div class="text-center"><div class="text-[9px] text-slate-500 uppercase">Patrimonio</div><div id="total-capital" class="text-emerald-400 font-mono text-lg font-bold">---</div></div>
                <div class="h-8 w-px bg-slate-800"></div>
                <div class="text-center cursor-pointer group" onclick="collectDividends()"><div class="text-[9px] text-slate-500 uppercase group-hover:text-amber-500">Riscatta</div><div id="total-dividends" class="text-cyan-400 font-mono text-lg font-bold group-hover:text-amber-400">---</div></div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="openProfile(currentUser.id)" class="flex items-center gap-3 px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded border border-slate-700"><div class="text-right"><div id="user-display" class="text-xs font-bold text-white">User</div><div id="user-balance-mini" class="text-[10px] text-amber-500 font-mono">0 GP</div></div><div class="w-8 h-8 bg-slate-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-user"></i></div></button>
                <button onclick="logout()" class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-red-500"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <div class="flex-grow p-4 grid grid-cols-12 gap-4 overflow-hidden">
            <div class="col-span-12 lg:col-span-3 flex flex-col gap-4 h-full overflow-hidden">
                <div onclick="openWarHub()" class="bg-gradient-to-br from-slate-900 to-red-950/30 border border-red-900/30 p-4 rounded cursor-pointer group hover:border-red-500 transition-all shadow-lg relative overflow-hidden"><div class="absolute -right-4 -top-4 text-red-900/20 text-6xl group-hover:scale-110 transition-transform"><i class="fa-solid fa-crosshairs"></i></div><h3 class="fantasy-font text-red-500 text-lg mb-1"><i class="fa-solid fa-shield-halved mr-2"></i> WAR ROOM</h3><p class="text-xs text-slate-400">Comando Unificato</p></div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openModal('create')" class="bg-slate-800 hover:bg-slate-700 p-3 rounded border border-slate-700 flex flex-col items-center justify-center gap-2 btn-action"><i class="fa-solid fa-plus text-emerald-500 text-xl"></i><span class="text-[10px] uppercase font-bold text-slate-300">Nuovo Asset</span></button>
                    <button onclick="triggerEvent()" class="bg-slate-800 hover:bg-slate-700 p-3 rounded border border-slate-700 flex flex-col items-center justify-center gap-2 btn-action"><i class="fa-solid fa-bolt text-yellow-500 text-xl"></i><span class="text-[10px] uppercase font-bold text-slate-300">Evento</span></button>
                </div>
                <div class="flex-grow bg-[#050a14] border border-slate-800 rounded flex flex-col overflow-hidden shadow-inner"><div class="bg-slate-900 p-2 text-[10px] font-bold text-slate-400 uppercase border-b border-slate-800 flex justify-between items-center"><span><i class="fa-solid fa-list-ul mr-1"></i> Log</span><div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div></div><div id="audit-log" class="flex-grow overflow-y-auto p-2 space-y-2 font-mono text-[10px]"></div></div>
            </div>
            <div class="col-span-12 lg:col-span-9 flex flex-col h-full overflow
