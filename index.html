<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Corp. | Management v30.0 (Split DB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --acc: #d97706; --panel: rgba(15, 23, 42, 0.85); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e2e8f0; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%); }
        .fantasy { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
        .glass { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; }
        .sidebar-link { padding: 12px 16px; color: #94a3b8; border-right: 3px solid transparent; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.05); color: #fff; border-color: var(--acc); }
        .sidebar-link i { width: 25px; }
        .toast { background: rgba(0,0,0,0.9); border-left: 4px solid var(--acc); padding: 12px; border-radius: 4px; animation: slide 0.3s; color: white; margin-bottom: 5px; }
        @keyframes slide { from{transform:translateX(100%)} to{transform:translateX(0)} }
        #toast-con { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        ::-webkit-scrollbar { width: 5px; background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="flex h-screen">

    <div id="toast-con"></div>
    
    <div id="login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center">
        <div class="w-96 p-8 border border-slate-800 rounded bg-slate-950 text-center">
            <h1 class="fantasy text-4xl text-amber-500 mb-2">INK CORP</h1>
            <p class="text-xs text-slate-500 mb-6">SECURE LOGIN v30.0</p>
            <input id="l-user" class="w-full bg-slate-900 border border-slate-700 p-2 mb-2 rounded text-center text-white" placeholder="UTENTE">
            <input id="l-pass" type="password" class="w-full bg-slate-900 border border-slate-700 p-2 mb-4 rounded text-center text-white" placeholder="PASSWORD">
            <button onclick="login()" class="w-full bg-amber-700 hover:bg-amber-600 text-black font-bold py-2 rounded">ENTRA</button>
            <div id="l-msg" class="text-red-500 text-xs mt-2 h-4"></div>
        </div>
    </div>

    <div id="app-ui" class="flex w-full h-full hidden">
        <nav class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-slate-800">
                <i class="fa-solid fa-dragon text-amber-500 text-xl mr-3"></i>
                <span class="fantasy text-lg text-slate-200">INK CORP</span>
            </div>
            <div class="flex-grow py-4">
                <div onclick="nav('dash')" class="sidebar-link active" id="n-dash"><i class="fa-solid fa-chart-pie"></i> Dashboard</div>
                <div onclick="nav('assets')" class="sidebar-link" id="n-assets"><i class="fa-solid fa-building"></i> Asset Corp.</div>
                <div onclick="nav('war')" class="sidebar-link" id="n-war"><i class="fa-solid fa-crosshairs"></i> War Room</div>
                <div onclick="nav('market')" class="sidebar-link" id="n-market"><i class="fa-solid fa-globe"></i> Mercato</div>
            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-900/50">
                <div onclick="openProfile()" class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded">
                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-user text-slate-400"></i></div>
                    <div><div id="u-name" class="text-sm font-bold">User</div><div id="u-bal" class="text-xs text-amber-500">0 GP</div></div>
                </div>
                <button onclick="location.reload()" class="text-xs text-red-500 mt-2 w-full text-left pl-2 hover:text-white"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>
        </nav>

        <main class="flex-grow p-6 overflow-y-auto relative">
            <header class="flex justify-between items-center mb-6">
                <h2 id="p-title" class="text-2xl text-white fantasy">DASHBOARD</h2>
                <div class="flex gap-3">
                    <select id="w-state" onchange="updateWorld()" class="bg-slate-900 border border-slate-700 text-amber-500 text-xs rounded p-2"><option value="neutral">Stabile</option><option value="war">Guerra</option><option value="boom">Boom</option><option value="crisis">Crisi</option></select>
                    <button onclick="refresh()" class="bg-slate-800 p-2 rounded text-emerald-500 hover:text-white"><i class="fa-solid fa-rotate"></i></button>
                </div>
            </header>

            <div id="v-dash" class="space-y-6">
                <div class="grid grid-cols-3 gap-4">
                    <div class="glass p-4"><div class="text-xs text-slate-500 font-bold">PATRIMONIO</div><div id="d-cap" class="text-xl text-emerald-400 font-mono">0</div></div>
                    <div class="glass p-4"><div class="text-xs text-slate-500 font-bold">TESORERIA</div><div id="d-treas" class="text-xl text-amber-400 font-mono">0</div></div>
                    <div class="glass p-4 flex gap-2"><button onclick="collect()" class="flex-1 bg-emerald-900/30 border border-emerald-800 text-emerald-400 text-xs font-bold rounded">DIVIDENDI</button><button onclick="openBank()" class="flex-1 bg-amber-900/30 border border-amber-800 text-amber-400 text-xs font-bold rounded">PRESTITO</button></div>
                </div>
                <div class="h-64 glass p-2 relative"><canvas id="chart"></canvas></div>
            </div>

            <div id="v-assets" class="hidden">
                <div class="flex justify-between mb-4"><span class="text-slate-400 text-xs">ASSET CORPORATIVI</span><button onclick="modal('create','corp')" class="bg-slate-800 text-white px-3 py-1 rounded text-xs font-bold border border-slate-600">+ NUOVO</button></div>
                <div id="g-corp" class="grid grid-cols-3 gap-4 pb-20"></div>
            </div>

            <div id="v-war" class="hidden h-full flex gap-4">
                <div class="w-1/3 glass p-4 flex flex-col">
                    <h3 class="text-red-500 font-bold text-xs mb-4">CASERMA</h3>
                    <div id="army-list" class="flex-grow space-y-2 overflow-y-auto"></div>
                </div>
                <div class="w-2/3 flex flex-col gap-4">
                    <div class="h-1/2 glass p-6 flex justify-between items-center text-center">
                        <div><div class="text-xs text-slate-500">BASE</div><div class="text-3xl text-white font-mono" id="c-base">0</div></div>
                        <i class="fa-solid fa-arrow-right text-slate-700"></i>
                        <div><div class="text-xs text-red-500">FRONTE</div><div class="text-3xl text-red-500 font-mono" id="c-front">0</div></div>
                    </div>
                    <div class="h-1/2 glass p-6">
                        <div class="text-xs text-slate-500 mb-2">LOGISTICA</div>
                        <div class="flex gap-2">
                            <select id="m-type" class="bg-slate-900 text-white text-xs p-2 rounded flex-grow"></select>
                            <input id="m-amt" type="number" value="1" class="bg-slate-900 text-white text-xs p-2 rounded w-20 text-center">
                            <button onclick="move()" class="bg-red-900 text-white px-4 rounded text-xs font-bold">SPOSTA</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="v-market" class="hidden"><div id="g-market" class="grid grid-cols-3 gap-4"></div></div>
        </main>
    </div>

    <div id="m-edit" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center">
        <div class="glass w-96 p-6">
            <h3 class="text-white font-bold mb-4">Gestione Asset</h3>
            <input type="hidden" id="e-id"><input type="hidden" id="e-mode"> <input id="e-name" class="w-full bg-slate-900 border border-slate-700 p-2 mb-2 rounded text-white text-xs" placeholder="Nome">
            <div class="flex gap-2 mb-2">
                <input id="e-val" type="number" class="w-1/2 bg-slate-900 border border-slate-700 p-2 rounded text-white text-xs" placeholder="Valore">
                <input id="e-roi" type="number" class="w-1/2 bg-slate-900 border border-slate-700 p-2 rounded text-white text-xs" placeholder="ROI %">
            </div>
            <textarea id="e-desc" class="w-full bg-slate-900 border border-slate-700 p-2 mb-4 rounded text-white text-xs h-20" placeholder="Note..."></textarea>
            <div class="flex justify-between">
                <button onclick="delAsset()" class="text-red-500 text-xs">ELIMINA</button>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('m-edit').classList.add('hidden')" class="text-slate-400 text-xs">CHIUDI</button>
                    <button onclick="saveAsset()" class="bg-emerald-700 text-white px-4 py-1 rounded text-xs">SALVA</button>
                </div>
            </div>
        </div>
    </div>

    <div id="m-prof" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center">
        <div class="bg-slate-950 w-[800px] h-[600px] border border-slate-800 rounded flex relative">
            <button onclick="document.getElementById('m-prof').classList.add('hidden')" class="absolute top-4 right-4 text-slate-500"><i class="fa-solid fa-times"></i></button>
            <div class="w-1/3 border-r border-slate-800 p-6 text-center">
                <div class="text-4xl text-slate-600 mb-4"><i class="fa-solid fa-user-circle"></i></div>
                <h2 id="p-name" class="text-xl text-white font-bold">User</h2>
                <div id="p-bal" class="text-emerald-400 font-mono text-lg my-2">0 GP</div>
                <textarea id="p-bio" class="w-full bg-slate-900 border border-slate-800 p-2 rounded text-xs text-slate-300 h-32 mt-4"></textarea>
                <button onclick="saveBio()" class="bg-slate-800 text-slate-400 w-full mt-2 py-1 rounded text-xs">SALVA BIO</button>
            </div>
            <div class="w-2/3 p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <span class="font-bold text-white">ZAINO ASSET PERSONALI</span>
                    <button onclick="modal('create','personal')" class="bg-emerald-900/50 text-emerald-400 px-3 py-1 rounded text-xs border border-emerald-800">+ CREA</button>
                </div>
                <div id="p-grid" class="flex-grow overflow-y-auto grid grid-cols-2 gap-3 content-start"></div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://mazammutcogkxhugfwqm.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hemFtbXV0Y29na3hodWdmd3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NjAwOTIsImV4cCI6MjA4NTQzNjA5Mn0.u99CFeecPwJrHYIUJv7miDSWoDUGJpg9S7MuaK_hMvM';
        const client = supabase.createClient(SB_URL, SB_KEY);
        let user = null, corpData = [], treasury = 0, chart;
        const armyUnits = [{id:'infantry',n:'Fanteria',c:100,p:1}, {id:'tank',n:'Carro',c:2500,p:30}, {id:'sniper',n:'Cecchino',c:300,p:4}];

        // AUTH
        async function login() {
            const u=document.getElementById('l-user').value, p=document.getElementById('l-pass').value;
            const {data, error} = await client.from('users').select('*').eq('username',u).eq('password',p).maybeSingle();
            if(error || !data) return msg('Credenziali errate');
            user = data; 
            if(!user.personal_assets) user.personal_assets = []; // Safety init
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            init();
        }
        function msg(t) { document.getElementById('l-msg').innerText = t; }

        // INIT
        async function init() {
            updateUI();
            await fetchData();
            renderChart();
            renderArmy();
        }

        async function fetchData() {
            let {data} = await client.from('investments').select('*').order('id');
            if(data) {
                corpData = data;
                let t = data.find(x => x.name === 'TESORERIA');
                treasury = t ? t.current_value : 0;
                renderCorp();
            }
            // Re-fetch user to get latest personal assets
            let {data:u} = await client.from('users').select('*').eq('id', user.id).single();
            if(u) user = u;
        }

        // RENDERERS
        function updateUI() {
            document.getElementById('u-name').innerText = user.username;
            document.getElementById('u-bal').innerText = user.balance.toLocaleString() + " GP";
            document.getElementById('p-name').innerText = user.username;
            document.getElementById('p-bal').innerText = user.balance.toLocaleString() + " GP";
            document.getElementById('p-bio').value = user.bio || "";
            document.getElementById('d-treas').innerText = treasury.toLocaleString();
        }

        function renderCorp() {
            const g = document.getElementById('g-corp'); g.innerHTML = '';
            let cap = 0;
            corpData.forEach(a => {
                if(a.name === 'TESORERIA' || a.name === 'COMANDO ARMATA') return;
                cap += a.current_value;
                g.innerHTML += `<div class="glass p-3 border-slate-700">
                    <div class="font-bold text-slate-200 text-sm">${a.name}</div>
                    <div class="text-xs text-slate-500 mb-2">${a.current_value} GP | ROI ${a.roi_rate}%</div>
                    <button onclick="modal('edit','corp','${a.id}')" class="bg-slate-800 text-slate-400 px-2 py-1 rounded text-[10px] w-full">GESTISCI</button>
                </div>`;
            });
            document.getElementById('d-cap').innerText = cap.toLocaleString();
        }

        function renderPersonal() {
            const g = document.getElementById('p-grid'); g.innerHTML = '';
            const list = user.personal_assets || [];
            if(list.length === 0) g.innerHTML = '<div class="col-span-2 text-slate-500 italic text-center">Zaino vuoto.</div>';
            
            list.forEach((a, idx) => {
                g.innerHTML += `<div class="bg-slate-900 border border-emerald-900/30 p-3 rounded flex justify-between items-center">
                    <div><div class="font-bold text-emerald-100 text-sm">${a.name}</div><div class="text-xs text-emerald-600">${a.val} GP | ROI ${a.roi}%</div></div>
                    <button onclick="modal('edit','personal',${idx})" class="text-slate-400 hover:text-white"><i class="fa-solid fa-pen"></i></button>
                </div>`;
            });
        }

        // ASSET LOGIC (THE FIX)
        // mode: 'corp' (table investments) or 'personal' (json in users)
        // id: db id for corp, array index for personal
        window.modal = (action, mode, id) => {
            document.getElementById('m-edit').classList.remove('hidden');
            document.getElementById('e-mode').value = mode;
            
            if(action === 'create') {
                document.getElementById('e-id').value = '';
                document.getElementById('e-name').value = '';
                document.getElementById('e-val').value = '';
                document.getElementById('e-roi').value = 0;
                document.getElementById('e-desc').value = '';
            } else {
                document.getElementById('e-id').value = id;
                let item;
                if(mode === 'corp') item = corpData.find(x => x.id == id);
                else item = user.personal_assets[id];
                
                document.getElementById('e-name').value = item.name;
                document.getElementById('e-val').value = mode==='corp' ? item.current_value : item.val;
                document.getElementById('e-roi').value = mode==='corp' ? item.roi_rate : item.roi;
                document.getElementById('e-desc').value = mode==='corp' ? item.description : item.desc;
            }
        }

        window.saveAsset = async () => {
            const mode = document.getElementById('e-mode').value;
            const id = document.getElementById('e-id').value;
            const name = document.getElementById('e-name').value;
            const val = parseInt(document.getElementById('e-val').value) || 0;
            const roi = parseFloat(document.getElementById('e-roi').value) || 0;
            const desc = document.getElementById('e-desc').value;

            if(mode === 'corp') {
                const payload = { name, current_value: val, roi_rate: roi, description: desc, status: 'Attivo' };
                if(id) await client.from('investments').update(payload).eq('id', id);
                else await client.from('investments').insert([payload]);
                fetchData();
            } else {
                // PERSONAL ASSET -> SAVE TO USER JSON
                let list = user.personal_assets || [];
                const newItem = { name, val, roi, desc };
                
                if(id !== '') list[id] = newItem; // Update existing at index
                else list.push(newItem); // Add new
                
                // Update DB
                const { error } = await client.from('users').update({ personal_assets: list }).eq('id', user.id);
                if(error) alert("Errore salvataggio: " + error.message);
                else {
                    user.personal_assets = list; // Update local
                    renderPersonal(); // Refresh view
                }
            }
            document.getElementById('m-edit').classList.add('hidden');
        }

        window.delAsset = async () => {
            if(!confirm("Eliminare?")) return;
            const mode = document.getElementById('e-mode').value;
            const id = document.getElementById('e-id').value;
            
            if(mode === 'corp') {
                await client.from('investments').delete().eq('id', id);
                fetchData();
            } else {
                let list = user.personal_assets;
                list.splice(id, 1); // Remove from array
                await client.from('users').update({ personal_assets: list }).eq('id', user.id);
                user.personal_assets = list;
                renderPersonal();
            }
            document.getElementById('m-edit').classList.add('hidden');
        }

        // PROFILE
        window.openProfile = () => {
            document.getElementById('m-prof').classList.remove('hidden');
            renderPersonal();
        }
        window.saveBio = async () => {
            await client.from('users').update({bio: document.getElementById('p-bio').value}).eq('id', user.id);
        }

        // BASIC NAV
        window.nav = (p) => {
            ['dash','assets','war','market'].forEach(v => document.getElementById('v-'+v).classList.add('hidden'));
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById('v-'+p).classList.remove('hidden');
            document.getElementById('n-'+p).classList.add('active');
            document.getElementById('p-title').innerText = p.toUpperCase();
        }

        // DUMMY CHART
        function renderChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            new Chart(ctx, { type: 'line', data: { labels: [1,2,3,4,5], datasets: [{ label: 'Corp Value', data: [10000, 12000, 11500, 14000, 16000], borderColor: '#10b981', tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false } });
        }

        // ARMY RENDER
        function renderArmy() {
            const l = document.getElementById('army-list'); l.innerHTML = '';
            const s = document.getElementById('m-type'); s.innerHTML = '';
            armyUnits.forEach(u => {
                l.innerHTML += `<div class="bg-slate-900 border border-slate-700 p-2 rounded flex justify-between text-xs items-center"><span>${u.n} (${u.p} Pwr)</span> <span class="text-amber-500">${u.c} GP</span></div>`;
                s.innerHTML += `<option value="${u.id}">${u.n}</option>`;
            });
        }
    </script>
</body>
</html>
