<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Corp. | Management System v13.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020617;
            --accent: #d97706;
            --terminal-green: #10b981;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
        }

        h1, h2, h3, .fantasy-font { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .btn-action { transition: all 0.2s; }
        .btn-action:active { transform: scale(0.95); }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .event-card { animation: slideIn 0.5s ease-out; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-sm">

    <audio id="sfx-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="sfx-coin" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-alarm" src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3"></audio>
    <audio id="sfx-boom" src="https://assets.mixkit.co/active_storage/sfx/257/257-preview.mp3"></audio>

    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95">
        <div class="w-full max-w-md p-8 border border-amber-900/50 rounded-lg bg-[#050101] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-600 to-transparent"></div>
            <div class="text-center mb-10">
                <h1 class="fantasy-font text-5xl text-amber-600 mb-2">INK CORP.</h1>
                <p class="text-slate-500 text-xs tracking-[0.4em] uppercase">System v13.0</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-user" class="w-full bg-slate-900/50 border border-slate-800 p-3 text-white rounded focus:border-amber-600 outline-none text-center tracking-widest" placeholder="NOME UTENTE">
                <input type="password" id="login-pass" class="w-full bg-slate-900/50 border border-slate-800 p-3 text-white rounded focus:border-amber-600 outline-none text-center tracking-widest" placeholder="PASSWORD">
                <button onclick="authLogin()" class="w-full bg-amber-700 hover:bg-amber-600 text-black font-bold py-3 rounded uppercase tracking-wider transition-colors">Connetti</button>
            </div>
            <div id="auth-msg" class="text-center text-xs text-red-500 mt-4 h-5"></div>
        </div>
    </div>
