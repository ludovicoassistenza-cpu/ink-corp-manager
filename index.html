<!DOCTYPE html>
<html lang=\"it\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>Ink Corp. | Tactical Terminal</title>
    <script src=\"https://cdn.tailwindcss.com\"></script>
    <script src=\"https://unpkg.com/@supabase/supabase-js@2\"></script>
    <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"></script>
    <link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">

    <style>
        :root {
            --bg-dark: #020617;
            --panel-bg: #0f172a;
            --accent: #d97706;
            --war-red: #991b1b;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: #e2e8f0; }
        .fantasy-font { font-family: 'Cinzel', serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .war-card:hover { border-color: var(--war-red); box-shadow: 0 0 20px rgba(153, 27, 27, 0.4); transform: scale(1.02); }
        .transition-all { transition: all 0.3s ease; }
        
        /* Animazione Radar */
        .radar-ping {
            position: absolute; width: 100%; height: 100%;
            border: 2px solid rgba(239, 68, 68, 0.3); border-radius: 50%;
            animation: ping 4s infinite;
        }
        @keyframes ping { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    </style>
</head>
<body class=\"h-screen overflow-hidden text-sm\">

    <audio id=\"sfx-click\" src=\"https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3\"></audio>
    <audio id=\"sfx-alarm\" src=\"https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3\"></audio>

    <div id=\"login-screen\" class=\"fixed inset-0 z-[100] flex items-center justify-center bg-[#020617]\">
        <div class=\"glass-panel p-8 rounded-xl w-full max-w-md text-center border-amber-500/20\">
            <h1 class=\"fantasy-font text-4xl text-amber-500 mb-6\">INK CORP.</h1>
            <input type=\"text\" id=\"login-user\" class=\"w-full bg-slate-950 border border-slate-700 p-3 mb-4 rounded\" placeholder=\"Operatore\">
            <input type=\"password\" id=\"login-pass\" class=\"w-full bg-slate-950 border border-slate-700 p-3 mb-6 rounded\" placeholder=\"Password\">
            <button onclick=\"authLogin()\" class=\"w-full bg-amber-600 py-3 rounded font-bold text-black hover:bg-amber-500 transition-all\">ACCEDI AL TERMINALE</button>
            <div id=\"auth-msg\" class=\"mt-4 text-red-400 text-xs\"></div>
        </div>
    </div>

    <div id=\"app-interface\" class=\"hidden h-full flex flex-col\">
        
        <header class=\"bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center\">
            <div class=\"flex items-center gap-4\">
                <div class=\"w-10 h-10 bg-amber-600 rounded flex items-center justify-center font-bold text-black fantasy-font\">IC</div>
                <h2 class=\"fantasy-font text-xl text-amber-500 tracking-tighter\">OPERATIONS BOARD</h2>
            </div>
            <div class=\"flex gap-6 items-center\">
                <div class=\"text-right\">
                    <span class=\"text-[10px] text-slate-500 block\">CAPITALE DISPONIBILE</span>
                    <span id=\"total-capital\" class=\"text-emerald-500 font-mono font-bold text-lg\">0 GP</span>
                </div>
                <button onclick=\"logout()\" class=\"text-slate-500 hover:text-white\">ESC</button>
            </div>
        </header>

        <main class=\"flex-grow p-6 grid grid-cols-12 gap-6 overflow-hidden\">
            
            <div class=\"col-span-12 md:col-span-3 space-y-4\">
                <div onclick=\"toggleWarRoom(true)\" class=\"war-card glass-panel p-6 rounded-xl border-red-900/40 cursor-pointer transition-all relative overflow-hidden group\">
                    <div class=\"radar-ping\"></div>
                    <div class=\"relative z-10 text-center\">
                        <span class=\"text-red-500 text-4xl block mb-2\">⚔️</span>
                        <h3 class=\"fantasy-font text-red-500 text-xl\">WAR ROOM</h3>
                        <p class=\"text-[10px] text-slate-400 uppercase tracking-widest mt-1\">Settore Rivali Attivo</p>
                        <div class=\"mt-4 flex justify-between items-end\">
                            <div class=\"text-left\">
                                <p class=\"text-[9px] text-slate-500\">TEAM B</p>
                                <div class=\"w-16 h-1 bg-red-900/50 mt-1\"><div id=\"mini-bar-b\" class=\"h-full bg-red-600\" style=\"width: 20%\"></div></div>
                            </div>
                            <div class=\"text-right\">
                                <p class=\"text-[9px] text-slate-500\">TEAM C</p>
                                <div class=\"w-16 h-1 bg-orange-900/50 mt-1\"><div id=\"mini-bar-c\" class=\"h-full bg-orange-600\" style=\"width: 10%\"></div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class=\"glass-panel p-4 rounded h-64 flex flex-col\">
                    <h4 class=\"text-[10px] font-bold text-slate-500 uppercase mb-2\">Live Intel Log</h4>
                    <div id=\"audit-log\" class=\"flex-grow overflow-y-auto text-[10px] font-mono space-y-1 text-slate-400\"></div>
                </div>
            </div>

            <div class=\"col-span-12 md:col-span-9 flex flex-col\">
                <div class=\"flex justify-between items-center mb-4\">
                    <h3 class=\"fantasy-font text-xl\">Asset Aziendali</h3>
                    <button onclick=\"openModal('create')\" class=\"bg-slate-800 border border-slate-700 px-4 py-1 rounded text-xs hover:bg-emerald-900/20 hover:border-emerald-500 transition-all\">+ Nuova Impresa</button>
                </div>
                <div id=\"asset-grid\" class=\"grid grid-cols-1 md:grid-cols-3 gap-4 overflow-y-auto pb-10\">
                    </div>
            </div>
        </main>
    </div>

    <div id=\"war-room-overlay\" class=\"fixed inset-0 z-50 bg-slate-950 hidden opacity-0 transition-opacity duration-500 flex flex-col\">
        <div class=\"p-6 bg-red-950/20 border-b border-red-900 flex justify-between items-center\">
            <div>
                <h1 class=\"fantasy-font text-3xl text-red-600 animate-pulse\">WAR ROOM :: TACTICAL OVERRIDE</h1>
                <p class=\"text-xs text-red-900 font-bold uppercase\">Ingaggio Forze Rivali - Protocollo Black-Ops</p>
            </div>
            <button onclick=\"toggleWarRoom(false)\" class=\"bg-red-900 hover:bg-red-700 text-white px-8 py-2 rounded font-bold transition-all\">TORNA ALLA DASHBOARD</button>
        </div>

        <div class=\"flex-grow p-8 grid grid-cols-12 gap-8 overflow-y-auto\">
            <div class=\"col-span-12 md:col-span-6 glass-panel border-red-900/50 p-6 rounded-2xl bg-gradient-to-br from-slate-900 to-red-950/20\">
                <div class=\"flex justify-between items-center mb-6\">
                    <h2 class=\"fantasy-font text-2xl text-red-400\">Team B: Iron Syndicate</h2>
                    <span id=\"war-val-b\" class=\"font-mono text-3xl text-red-600\">0%</span>
                </div>
                <div class=\"w-full bg-slate-950 h-4 rounded-full border border-red-900 mb-8 overflow-hidden\">
                    <div id=\"war-bar-b\" class=\"h-full bg-gradient-to-r from-red-900 to-red-500 shadow-[0_0_15px_red] transition-all duration-1000\"></div>
                </div>
                
                <div class=\"grid grid-cols-2 gap-4\">
                    <button onclick=\"executeWarAction('B', 'sabotage', 500)\" class=\"p-4 bg-slate-900 border border-red-900 rounded hover:bg-red-900/40 group transition-all\">
                        <span class=\"block text-xl\">🔥</span>
                        <span class=\"font-bold text-red-400 block\">SABOTAGGIO</span>
                        <span class=\"text-[9px] text-slate-500\">-500 GP | -15% Rivali</span>
                    </button>
                    <button onclick=\"executeWarAction('B', 'spy', 200)\" class=\"p-4 bg-slate-900 border border-red-900 rounded hover:bg-red-900/40 transition-all\">
                        <span class=\"block text-xl\">👁️</span>
                        <span class=\"font-bold text-red-400 block\">SPIONAGGIO</span>
                        <span class=\"text-[9px] text-slate-500\">-200 GP | Analisi ROI</span>
                    </button>
                    <button onclick=\"executeWarAction('B', 'hack', 1000)\" class=\"p-4 bg-slate-900 border border-red-900 rounded hover:bg-red-900/40 transition-all col-span-2\">
                        <span class=\"block text-xl\">💻</span>
                        <span class=\"font-bold text-red-400 block\">CYBER ATTACCO</span>
                        <span class=\"text-[9px] text-slate-500\">-1000 GP | Reset Totale 0%</span>
                    </button>
                </div>
            </div>

            <div class=\"col-span-12 md:col-span-6 glass-panel border-orange-900/50 p-6 rounded-2xl bg-gradient-to-br from-slate-900 to-orange-950/20\">
                <div class=\"flex justify-between items-center mb-6\">
                    <h2 class=\"fantasy-font text-2xl text-orange-400\">Team C: Gilded Hand</h2>
                    <span id=\"war-val-c\" class=\"font-mono text-3xl text-orange-600\">0%</span>
                </div>
                <div class=\"w-full bg-slate-950 h-4 rounded-full border border-orange-900 mb-8 overflow-hidden\">
                    <div id=\"war-bar-c\" class=\"h-full bg-gradient-to-r from-orange-900 to-orange-500 shadow-[0_0_15px_orange] transition-all duration-1000\"></div>
                </div>
                
                <div class=\"grid grid-cols-2 gap-4\">
                    <button onclick=\"executeWarAction('C', 'sabotage', 500)\" class=\"p-4 bg-slate-900 border border-orange-900 rounded hover:bg-orange-900/40 transition-all\">
                        <span class=\"block text-xl\">🧨</span>
                        <span class=\"font-bold text-orange-400 block\">SABOTAGGIO</span>
                        <span class=\"text-[9px] text-slate-500\">-500 GP</span>
                    </button>
                    <button onclick=\"executeWarAction('C', 'propaganda', 300)\" class=\"p-4 bg-slate-900 border border-orange-900 rounded hover:bg-orange-900/40 transition-all\">
                        <span class=\"block text-xl\">📢</span>
                        <span class=\"font-bold text-orange-400 block\">PROPAGANDA</span>
                        <span class=\"text-[9px] text-slate-500\">-300 GP</span>
                    </button>
                    <button onclick=\"executeWarAction('C', 'hostile-takeover', 2000)\" class=\"p-4 bg-slate-900 border border-orange-900 rounded hover:bg-orange-900/40 transition-all col-span-2\">
                        <span class=\"block text-xl\">🤝</span>
                        <span class=\"font-bold text-orange-400 block\">SCALATA OSTILE</span>
                        <span class=\"text-[9px] text-slate-500\">-2000 GP | Assorbimento Asset</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id=\"modal-create\" class=\"fixed inset-0 z-[60] bg-black/90 hidden flex items-center justify-center p-4\">
        <div class=\"bg-slate-900 border border-emerald-900 p-8 rounded-xl max-w-sm w-full\">
            <h3 class=\"fantasy-font text-xl text-emerald-500 mb-4\">Nuova Iniziativa</h3>
            <input type=\"text\" id=\"new-name\" class=\"w-full bg-slate-950 border border-slate-800 p-2 mb-4 rounded\" placeholder=\"Nome Impresa\">
            <input type=\"number\" id=\"new-val\" class=\"w-full bg-slate-950 border border-slate-800 p-2 mb-4 rounded\" placeholder=\"Budget GP\">
            <div class=\"flex gap-2\">
                <button onclick=\"closeModal('modal-create')\" class=\"flex-1 text-slate-500\">Annulla</button>
                <button onclick=\"executeCreate()\" class=\"flex-1 bg-emerald-700 p-2 rounded font-bold\">Avvia</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIG SUPABASE
        const SUPABASE_URL = 'https://mazammutcogkxhugfwqm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hemFtbXV0Y29na3hodWdmd3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NjAwOTIsImV4cCI6MjA4NTQzNjA5Mn0.u99CFeecPwJrHYIUJv7miDSWoDUGJpg9S7MuaK_hMvM';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let rivals = { B: 15, C: 5 };

        // AUTH & NAVIGATION
        async function authLogin() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const { data, error } = await client.from('users').select('*').eq('username', user).eq('password', pass).single();
            
            if (data) {
                currentUser = data;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-interface').classList.remove('hidden');
                initApp();
            } else {
                document.getElementById('auth-msg').innerText = \"Accesso negato.\";
            }
        }

        function toggleWarRoom(show) {
            const overlay = document.getElementById('war-room-overlay');
            playSound(show ? 'alarm' : 'click');
            if(show) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                updateWarUI();
            } else {
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 500);
            }
        }

        // WAR ROOM LOGIC
        function updateWarUI() {
            // Update Bars
            document.getElementById('war-bar-b').style.width = rivals.B + \"%\";
            document.getElementById('war-val-b').innerText = rivals.B + \"%\";
            document.getElementById('war-bar-c').style.width = rivals.C + \"%\";
            document.getElementById('war-val-c').innerText = rivals.C + \"%\";
            
            // Mini Bars Dashboard
            document.getElementById('mini-bar-b').style.width = rivals.B + \"%\";
            document.getElementById('mini-bar-c').style.width = rivals.C + \"%\";
        }

        async function executeWarAction(team, type, cost) {
            if(confirm(\`Confermi operazione \${type.toUpperCase()}? Costo: \${cost} GP\`)) {
                if(type === 'sabotage') rivals[team] = Math.max(0, rivals[team] - 15);
                if(type === 'hack') rivals[team] = 0;
                if(type === 'hostile-takeover') {
                    rivals[team] = 0;
                    alert(\"Asset nemici acquisiti con successo.\");
                }
                
                updateWarUI();
                await logEvent(\`[TACTICAL] \${type.toUpperCase()} eseguito contro Team \${team}\`, 'error');
                playSound('alarm');
            }
        }

        // CORE FUNCTIONS
        async function initApp() {
            const { data } = await client.from('investments').select('*');
            renderGrid(data);
            fetchLogs();
            updateWarUI();
        }

        function renderGrid(data) {
            const grid = document.getElementById('asset-grid');
            grid.innerHTML = '';
            let total = 0;
            data.forEach(item => {
                total += item.current_value;
                const card = document.createElement('div');
                card.className = \"glass-panel p-4 rounded-xl border-slate-800\";
                card.innerHTML = \`
                    <div class=\"flex justify-between mb-2\">
                        <span class=\"font-bold text-slate-200\">\${item.name}</span>
                        <span class=\"text-emerald-500 font-mono\">\${item.current_value} GP</span>
                    </div>
                    <div class=\"text-[10px] text-slate-500\">\${item.status} | ROI \${item.roi_rate}%</div>
                \`;
                grid.appendChild(card);
            });
            document.getElementById('total-capital').innerText = total.toLocaleString() + \" GP\";
        }

        async function logEvent(action, type) {
            await client.from('audit_logs').insert([{ username: currentUser.username, action, type }]);
            fetchLogs();
        }

        async function fetchLogs() {
            const { data } = await client.from('audit_logs').select('*').order('created_at', {ascending: false}).limit(15);
            const con = document.getElementById('audit-log');
            con.innerHTML = data.map(l => \`<div><span class=\"text-slate-600\">[\${new Date(l.created_at).toLocaleTimeString()}]</span> \${l.action}</div>\`).join('');
        }

        function playSound(id) { document.getElementById('sfx-'+id)?.play().catch(()=>{}); }
        function openModal(id) { document.getElementById('modal-'+id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
